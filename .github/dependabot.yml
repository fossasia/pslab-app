version: 2

updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    ignore:
      # Prevent out-of-sync bumps; update this manually with flutter_rust
      - dependency-name: "flutter_rust_bridge"
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/android"
      - "/.github/actions/common"
      - "/.github/actions/ios"
      - "/.github/actions/linux-arm64"
      - "/.github/actions/linux"
      - "/.github/actions/macos"
      - "/.github/actions/screenshot-android"
      - "/.github/actions/screenshot-ipad"
      - "/.github/actions/screenshot-iphone"
      - "/.github/actions/web"
      - "/.github/actions/windows"
      - "/.github/workflows"
    schedule:
      interval: "daily"
