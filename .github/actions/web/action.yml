name: "Web App Workflow"

inputs:
  VERSION_NAME:
    description: 'Version Name to be used for build'
    required: false
    default: '1.0.0'
  VERSION_CODE:
    description: 'Version Code to be used for build'
    required: true
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        cache: true
        flutter-version-file: pubspec.yaml

    - name: Install System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev libasound2-dev

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: 'latest'

    - name: Add WebAssembly to Rust
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        rustup toolchain install nightly
        rustup component add rust-src --toolchain nightly
        cargo install cargo-expand
        cargo install flutter_rust_bridge_codegen

    - name: Install Flutter Dependencies
      shell: bash
      run: flutter pub get

    - name: Compile Rust for Web
      shell: bash
      run: |
        flutter_rust_bridge_codegen generate
        flutter_rust_bridge_codegen build-web

    - name: Build Web App
      shell: bash
      run: |
        flutter config --enable-web
        flutter build web --wasm --build-name ${{ inputs.VERSION_NAME }} --build-number ${{ inputs.VERSION_CODE }}

    - name: Create Web Archive
      shell: bash
      run: |
        cd build/web
        zip -r ../pslab-web-app-${{ inputs.VERSION_NAME }}.zip .

    - name: Store Archive
      uses: actions/upload-artifact@v7
      with:
        name: pslab-web-app-${{ inputs.VERSION_NAME }}
        path: build/pslab-web-app-${{ inputs.VERSION_NAME }}.zip