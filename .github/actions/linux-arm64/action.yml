name: "Linux ARM64 Workflow"

inputs:
  VERSION_NAME:
    description: 'Version Name to be used for build'
    required: false
    default: '1.0.0'
  VERSION_CODE:
    description: 'Version Code to be used for build'
    required: true
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Install dependencies from Apt
      shell: bash
      run: |
        sudo apt-get update -y;
        sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev yq libudev-dev

    - name: Clone Flutter
      shell: bash
      run: |
        # get Flutter version from pubspec.yaml
        FLUTTER_VERSION="$(yq -r '.environment.flutter' pubspec.yaml)"

        # Shallow-clone Flutter to reduce download size
        git clone --depth 1 --branch $FLUTTER_VERSION https://github.com/flutter/flutter.git $RUNNER_TEMP/flutter

        # Add Flutter to PATH
        echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH

    - name: Install Flutter
      shell: bash
      # Running "flutter doctor" will download Flutter's dependencies
      run: flutter doctor
    
    - name: Build Linux App
      shell: bash
      run: |
        flutter config --enable-linux-desktop
        source linux/prep.sh
        # Flutter ignores --build-name/--build-number on Linux (flutter/flutter#152236).
        # Bake the CI version into pubspec.yaml so version.json / PackageInfo are correct.
        sed -i "s/^version: .*/version: ${{ inputs.VERSION_NAME }}+${{ inputs.VERSION_CODE }}/" pubspec.yaml
        flutter build linux --release \
          --build-name ${{ inputs.VERSION_NAME }} \
          --build-number ${{ inputs.VERSION_CODE }}
        # Ensure the bundled version.json matches even if Flutter still ignores the flags.
        for vf in build/linux/*/release/bundle/data/flutter_assets/version.json \
                  build/linux/*/release/bundle/share/pslab/flutter_assets/version.json; do
          [ -f "$vf" ] || continue
          python3 -c "import json,sys; p,v,b=sys.argv[1:4]; d=json.load(open(p)); d['version']=v; d['build_number']=b; json.dump(d, open(p,'w'))" \
            "$vf" "${{ inputs.VERSION_NAME }}" "${{ inputs.VERSION_CODE }}"
        done

    - name: Install fpm
      shell: bash
      run: |
        sudo apt-get install -y ruby ruby-dev build-essential
        sudo gem install --no-document fpm
    
    - name: Build .deb package
      shell: bash
      run: |
        fpm -s dir -t deb \
          -n pslab \
          -v ${{ inputs.VERSION_NAME }} \
          --prefix=/ \
          --depends libusb-1.0-0 \
          build/linux/arm64/release/bundle/bin/=/usr/bin \
          build/linux/arm64/release/bundle/lib/pslab/=/usr/lib/pslab \
          build/linux/arm64/release/bundle/share/pslab/=/usr/share/pslab \
          linux/pslab.desktop=/usr/share/applications/pslab.desktop \
          linux/assets/pslab.png=/usr/share/icons/hicolor/512x512/apps/pslab.png \
          linux/99-pslab.rules=/etc/udev/rules.d/99-pslab.rules

    - name: Build .rpm package
      shell: bash
      run: |
        fpm -s dir -t rpm \
          -n pslab \
          -v ${{ inputs.VERSION_NAME }} \
          --prefix=/ \
          --depends libusb1 \
          build/linux/arm64/release/bundle/bin/=/usr/bin \
          build/linux/arm64/release/bundle/lib/pslab/=/usr/lib/pslab \
          build/linux/arm64/release/bundle/share/pslab/=/usr/share/pslab \
          linux/pslab.desktop=/usr/share/applications/pslab.desktop \
          linux/assets/pslab.png=/usr/share/icons/hicolor/512x512/apps/pslab.png \
          linux/99-pslab.rules=/etc/udev/rules.d/99-pslab.rules

    - name: Store Packages
      uses: actions/upload-artifact@v7
      with:
        name: linux-packages-arm64
        path: "*.deb\n*.rpm"
